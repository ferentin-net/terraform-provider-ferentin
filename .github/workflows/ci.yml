name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ferentin-cli-app is a private module, so every job that resolves Go
# dependencies needs GOPRIVATE plus a PAT with read access to that repo.
env:
  GOPRIVATE: github.com/ferentin-net/*

jobs:
  # Release guard. The SDK lives in a sibling repo, so local development is
  # tempting to unblock with `replace ... => ../ferentin-cli-app`. A committed
  # replace directive breaks both CI (the sibling path does not exist in a
  # checkout) and the registry build, and the failure only surfaces at publish
  # time. Local dev uses go.work instead — see DEVELOPMENT.md.
  no-replace:
    name: No replace directives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Assert go.mod has no replace directive
        run: |
          if grep -qE '^replace ' go.mod; then
            echo "::error file=go.mod::go.mod contains a replace directive. Local multi-repo development must use go.work (gitignored), not a committed replace. See DEVELOPMENT.md."
            grep -nE '^replace ' go.mod
            exit 1
          fi
          echo "ok: no replace directives"
      - name: Assert go.work is not committed
        run: |
          if git ls-files --error-unmatch go.work >/dev/null 2>&1; then
            echo "::error file=go.work::go.work must not be committed — it pins a local filesystem layout. It is gitignored on purpose."
            exit 1
          fi
          echo "ok: go.work is not tracked"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure access to private modules
        run: git config --global url."https://x-access-token:${{ secrets.FERENTIN_CI_PAT }}@github.com/".insteadOf "https://github.com/"
      - run: go mod download
      - run: go build -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure access to private modules
        run: git config --global url."https://x-access-token:${{ secrets.FERENTIN_CI_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee  # v9.2.1
        with:
          version: v2.12.2

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure access to private modules
        run: git config --global url."https://x-access-token:${{ secrets.FERENTIN_CI_PAT }}@github.com/".insteadOf "https://github.com/"
      - run: go mod download
      - run: go test -v -count=1 -timeout 5m ./...

  docs-check:
    name: Docs up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure access to private modules
        run: git config --global url."https://x-access-token:${{ secrets.FERENTIN_CI_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Regenerate docs/ and diff
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs \
            generate --provider-name ferentin --rendered-provider-name "Ferentin"
          if ! git diff --quiet docs/; then
            echo "::error::docs/ is stale — run 'make docs' and commit the result"
            git diff --stat docs/
            exit 1
          fi
