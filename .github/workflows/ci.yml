name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ferentin-cli-app is a private module, so every job that resolves Go
# dependencies needs GOPRIVATE plus a PAT with read access to that repo.
env:
  GOPRIVATE: github.com/ferentin-net/*

jobs:
  # Release guard. The SDK lives in a sibling repo, so local development is
  # tempting to unblock with `replace ... => ../ferentin-cli-app`. A committed
  # replace directive breaks both CI (the sibling path does not exist in a
  # checkout) and the registry build, and the failure only surfaces at publish
  # time. Local dev uses go.work instead — see DEVELOPMENT.md.
  no-replace:
    name: No replace directives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Assert go.mod has no replace directive
        run: |
          if grep -qE '^replace ' go.mod; then
            echo "::error file=go.mod::go.mod contains a replace directive. Local multi-repo development must use go.work (gitignored), not a committed replace. See DEVELOPMENT.md."
            grep -nE '^replace ' go.mod
            exit 1
          fi
          echo "ok: no replace directives"
      - name: Assert go.work is not committed
        run: |
          if git ls-files --error-unmatch go.work >/dev/null 2>&1; then
            echo "::error file=go.work::go.work must not be committed — it pins a local filesystem layout. It is gitignored on purpose."
            exit 1
          fi
          echo "ok: go.work is not tracked"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure access to private modules
        run: git config --global url."https://x-access-token:${{ secrets.FERENTIN_CI_PAT }}@github.com/".insteadOf "https://github.com/"
      - run: go mod download
      - run: go build -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure access to private modules
        run: git config --global url."https://x-access-token:${{ secrets.FERENTIN_CI_PAT }}@github.com/".insteadOf "https://github.com/"
      # `install-mode: goinstall` compiles the linter with this job's Go rather
      # than downloading a prebuilt release. A released binary type-checks with
      # the Go it was built with, and the v2.12.2 artifact was built with
      # go1.26.2 — so the moment go.mod's language version outran it (1.26.5 ->
      # 1.27.0) the prebuilt binary rejected our source outright, before running
      # a single linter: "the Go language version (go1.26) used to build
      # golangci-lint is lower than the targeted Go version (1.27.0)". Compiling
      # from source removes that coupling permanently; bumping `version:` alone
      # only defers it to the next Go bump. Mirrors ferentin-cli-app, which
      # pins `install-mode: goinstall` for this reason.
      #
      # The VERSION is read out of the GNUmakefile rather than written here.
      # Two copies is how this job came to run v2.12.2 while `make lint` ran
      # whatever was on a developer's PATH — so a local run reported 0 issues
      # against a linter that was not the one gating the merge, and the one
      # that was panicked on Go 1.27's internal/poll and exited 3. The
      # Makefile carries the reasoning; keep this reading it back.
      - name: Resolve the pinned golangci-lint version
        id: golangci
        run: echo "version=$(make -s print-golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        env:
          GOTOOLCHAIN: auto
        with:
          version: ${{ steps.golangci.outputs.version }}
          install-mode: goinstall

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure access to private modules
        run: git config --global url."https://x-access-token:${{ secrets.FERENTIN_CI_PAT }}@github.com/".insteadOf "https://github.com/"
      # TestAcceptanceFixturesValidate runs `terraform validate` over every
      # acceptance fixture against the real provider schema — no platform, no
      # credentials. It self-skips when terraform is absent, so installing it
      # here is what makes that gate exist in CI. See issue #6: most of the
      # stale-suite failures were schema drift validate catches on its own.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false
      - run: go mod download
      - run: go test -v -count=1 -timeout 5m ./...

  # examples/ is embedded verbatim into docs/ by tfplugindocs, so a
  # mis-formatted example ships to the registry and quietly fails the next
  # `make docs-check`. This is the cheap guard for that.
  examples-fmt:
    name: Examples formatted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false
      - name: terraform fmt -check
        run: |
          if ! terraform fmt -check -recursive -diff examples/; then
            echo "::error::examples/ is not formatted — run 'terraform fmt -recursive examples/' and commit"
            exit 1
          fi

  docs-check:
    name: Docs up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure access to private modules
        run: git config --global url."https://x-access-token:${{ secrets.FERENTIN_CI_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Regenerate docs/ and diff
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs \
            generate --provider-name ferentin --rendered-provider-name "Ferentin"
          if ! git diff --quiet docs/; then
            echo "::error::docs/ is stale — run 'make docs' and commit the result"
            git diff --stat docs/
            exit 1
          fi
